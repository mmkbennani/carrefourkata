server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:carrefourDB
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect


kafka:
  topic:
    drive-deliver: drive_deliver_cmd
